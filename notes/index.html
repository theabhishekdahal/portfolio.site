<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes · Abhishek Dahal</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="description" content="Study notes by Abhishek Dahal — CA exam notes, financial accounting, auditing, and more.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a192f;
            --primary-color: #64ffda;
            --white-color: #edeef7;
            --light-text: #e6f1ff;
            --dark-text: #a8b2d1;
            --light-navy: #112240;
            --slate: #8892b0;
            --mouse-x: 50%;
            --mouse-y: 50%;
        }
        body {
            background-color: var(--bg-color);
            color: var(--dark-text);
            font-family: 'Inter', sans-serif;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(600px circle at var(--mouse-x) var(--mouse-y), rgba(42,67,101,0.3), transparent 80%);
            z-index: -1;
            pointer-events: none;
        }
        .note-card {
            background-color: var(--light-navy);
            border: 1px solid rgba(100,255,218,0.08);
            border-radius: 0.75rem;
            transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
        }
        .note-card:hover {
            border-color: rgba(100,255,218,0.35);
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(100,255,218,0.07);
        }
        .badge {
            background-color: rgba(100,255,218,0.1);
            color: var(--primary-color);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .tag-pill {
            background-color: rgba(136,146,176,0.12);
            color: var(--slate);
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: 9999px;
        }
        .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.5s ease, transform 0.5s ease; }
        .reveal.visible { opacity: 1; transform: translateY(0); }
        input[type="text"] { outline: none; }
        input[type="text"]:focus { border-color: var(--primary-color); }
    </style>
</head>
<body class="text-base">

    <!-- Top navigation bar -->
    <header class="sticky top-0 z-50 bg-[#0a192f]/90 backdrop-blur-md border-b border-white/5">
        <div class="max-w-screen-xl mx-auto px-6 sm:px-12 py-4 flex items-center justify-between">
            <a href="/" class="text-[color:var(--white-color)] font-bold text-lg hover:text-[color:var(--primary-color)] transition-colors">
                ← Abhishek Dahal
            </a>
            <span class="text-sm font-bold uppercase tracking-widest text-[color:var(--primary-color)]">Notes</span>
        </div>
    </header>

    <main class="max-w-screen-xl mx-auto px-6 sm:px-12 py-16">

        <!-- Page heading -->
        <div class="reveal mb-12">
            <h1 class="text-4xl sm:text-5xl font-bold text-[color:var(--white-color)] mb-4">My Notes</h1>
            <p class="max-w-2xl text-[color:var(--dark-text)]">
                Study notes, concept summaries, and reference material. Select any note to open it
                in the PDF-style reader, navigate pages, and leave comments.
            </p>
        </div>

        <!-- Search & filter bar -->
        <div class="reveal mb-10 flex flex-col sm:flex-row gap-4">
            <input
                id="search"
                type="text"
                placeholder="Search notes…"
                class="flex-1 bg-[color:var(--light-navy)] border border-white/10 rounded-lg px-4 py-2.5 text-sm text-[color:var(--white-color)] placeholder-slate-500 transition-colors"
            >
            <select
                id="category-filter"
                class="bg-[color:var(--light-navy)] border border-white/10 rounded-lg px-4 py-2.5 text-sm text-[color:var(--dark-text)] cursor-pointer"
            >
                <option value="">All Categories</option>
            </select>
        </div>

        <!-- Notes grid -->
        <div id="notes-grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>

        <!-- Empty state -->
        <div id="empty-state" style="display:none" class="text-center py-24 text-[color:var(--slate)]">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-4 opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <p class="text-lg font-medium">No notes found</p>
            <p class="text-sm mt-1 opacity-70">Try a different search or category.</p>
        </div>

    </main>

    <footer class="text-center text-xs text-slate-600 pb-8">
        <p>Notes by <a href="/" class="hover:text-[color:var(--primary-color)] transition-colors">Abhishek Dahal</a></p>
    </footer>

    <script src="notes-data.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // Mouse radial gradient tracking
        document.addEventListener('mousemove', e => {
            document.documentElement.style.setProperty('--mouse-x', `${e.clientX}px`);
            document.documentElement.style.setProperty('--mouse-y', `${e.clientY}px`);
        });

        // Populate category filter
        const categories = [...new Set(notesData.map(n => n.category))].sort();
        const select = document.getElementById('category-filter');
        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            select.appendChild(opt);
        });

        function renderNotes(notes) {
            const grid = document.getElementById('notes-grid');
            const empty = document.getElementById('empty-state');
            grid.innerHTML = '';
            if (notes.length === 0) {
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';
            notes.forEach((note, i) => {
                const date = new Date(note.date).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                const tagsHTML = note.tags.map(t => `<span class="tag-pill">${t}</span>`).join('');
                const card = document.createElement('div');
                card.className = 'reveal note-card p-6 flex flex-col gap-4';
                card.style.transitionDelay = `${i * 60}ms`;
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <span class="badge">${note.category}</span>
                        <span class="text-xs text-[color:var(--slate)] shrink-0 font-mono">${date}</span>
                    </div>
                    <div>
                        <h2 class="text-base font-bold text-[color:var(--white-color)] leading-snug mb-2">${note.title}</h2>
                        <p class="text-sm text-[color:var(--dark-text)] line-clamp-3">${note.description}</p>
                    </div>
                    <div class="flex flex-wrap gap-1.5 mt-auto">${tagsHTML}</div>
                    <a
                        href="/notes/viewer.html?note=${encodeURIComponent(note.id)}"
                        class="mt-2 inline-flex items-center gap-2 text-sm font-semibold text-[color:var(--primary-color)] hover:opacity-75 transition-opacity"
                    >
                        Open note
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </a>
                `;
                grid.appendChild(card);
            });

            // Trigger reveal animations
            requestAnimationFrame(() => {
                const observer = new IntersectionObserver((entries, obs) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) { entry.target.classList.add('visible'); obs.unobserve(entry.target); }
                    });
                }, { threshold: 0.05 });
                document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
            });
        }

        function filterNotes() {
            const q = document.getElementById('search').value.toLowerCase();
            const cat = document.getElementById('category-filter').value;
            const filtered = notesData.filter(note => {
                const matchesSearch = !q ||
                    note.title.toLowerCase().includes(q) ||
                    note.description.toLowerCase().includes(q) ||
                    note.tags.some(t => t.toLowerCase().includes(q));
                const matchesCat = !cat || note.category === cat;
                return matchesSearch && matchesCat;
            });
            renderNotes(filtered);
        }

        document.getElementById('search').addEventListener('input', filterNotes);
        document.getElementById('category-filter').addEventListener('change', filterNotes);

        renderNotes(notesData);

        // Trigger page-level reveal animations
        requestAnimationFrame(() => {
            const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) { entry.target.classList.add('visible'); obs.unobserve(entry.target); }
                });
            }, { threshold: 0.05 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        });
    });
    </script>
</body>
</html>
