<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Library · Abhishek Dahal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-navy: #0a192f;
            --light-navy: #112240;
            --primary-teal: #64ffda;
            --slate: #8892b0;
            --white: #edeef7;
        }
        body { background-color: #1e2a3a; font-family: 'Inter', sans-serif; margin: 0; color: var(--white); }
        
        #library-container { max-width: 1100px; margin: 4rem auto; padding: 0 1.5rem; }

        /* ── SEARCH & FILTER ── */
        #search-bar {
            background: var(--light-navy);
            border: 1px solid rgba(100, 255, 218, 0.2);
            color: white;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            width: 100%;
            outline: none;
            transition: border-color 0.3s;
        }
        #search-bar:focus { border-color: var(--primary-teal); }

        .filter-pill {
            background: rgba(100, 255, 218, 0.05);
            border: 1px solid rgba(100, 255, 218, 0.2);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--slate);
            white-space: nowrap;
        }
        .filter-pill.active {
            background: var(--primary-teal);
            color: var(--bg-navy);
            border-color: var(--primary-teal);
        }

        /* ── CARDS ── */
        .note-card { 
            background: var(--light-navy); 
            border: 1px solid rgba(100, 255, 218, 0.1); 
            padding: 1.5rem; 
            border-radius: 12px; 
            transition: all 0.3s ease; 
            text-decoration: none;
            display: flex; 
            flex-direction: column; 
            gap: 0.4rem;
            box-shadow: 0 10px 30px -15px rgba(2, 12, 27, 0.7);
        }
        .note-card:hover { transform: translateY(-5px); border-color: var(--primary-teal); background: rgba(100, 255, 218, 0.03); }
        .note-card h3 { color: var(--white); font-weight: 700; font-size: 1.1rem; margin: 0; line-height: 1.4; }
        .note-card .subject-tag { color: var(--primary-teal); font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; }
    </style>
</head>
<body>

    <div id="library-container">
        <header class="mb-8">
            <h1 class="text-4xl font-extrabold text-white mb-2 tracking-tight">Academic Notes</h1>
            <p class="text-slate-400 text-sm mb-8">Browse notes by subject or search by chapter name.</p>
            
            <!-- Search Bar -->
            <input type="text" id="search-bar" placeholder="Search chapters (e.g. Mutual Fund)..." class="mb-6">
            
            <!-- Categories Container -->
            <div id="categories-container" class="flex flex-wrap gap-2 mb-4">
                <button class="filter-pill active" data-subject="all">All Subjects</button>
                <!-- Dynamic subjects will be injected here -->
            </div>
        </header>

        <div id="notes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <div class="col-span-full text-center py-20 text-slate-500 animate-pulse font-bold text-sm">LOADING REPOSITORY...</div>
        </div>
    </div>

    <script>
        const REPO_OWNER = "theabhishekdahal";
        const REPO_NAME = "portfolio.site";
        const NOTES_FOLDER = "notes"; 

        let allNotes = []; // Stores the parsed file data
        let currentSubject = 'all';

        async function fetchNotes() {
            const grid = document.getElementById('notes-grid');
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${NOTES_FOLDER}`);
                const files = await response.json();
                
                // 1. Parse files into data objects
                allNotes = files
                    .filter(f => f.name.endsWith('.html') && f.name.toLowerCase() !== 'index.html')
                    .map(file => {
                        const parts = file.name.replace('.html', '').split('_');
                        return {
                            fileName: file.name,
                            subject: parts[0] || 'General',
                            chapter: (parts[1] || parts[0]).replace(/-/g, ' '),
                            url: file.name
                        };
                    });

                // 2. Generate unique Subject buttons
                const subjects = [...new Set(allNotes.map(n => n.subject))];
                const catContainer = document.getElementById('categories-container');
                subjects.forEach(sub => {
                    const btn = document.createElement('button');
                    btn.className = 'filter-pill';
                    btn.textContent = sub.toUpperCase();
                    btn.dataset.subject = sub;
                    btn.onclick = () => filterBySubject(sub, btn);
                    catContainer.appendChild(btn);
                });

                renderNotes();

            } catch (error) {
                grid.innerHTML = `<div class="col-span-full text-center text-red-400 text-sm">Error: Unable to connect to GitHub.</div>`;
            }
        }

        function renderNotes() {
            const grid = document.getElementById('notes-grid');
            const searchTerm = document.getElementById('search-bar').value.toLowerCase();
            
            grid.innerHTML = '';

            const filtered = allNotes.filter(note => {
                const matchesSearch = note.chapter.toLowerCase().includes(searchTerm) || 
                                    note.subject.toLowerCase().includes(searchTerm);
                const matchesSubject = currentSubject === 'all' || note.subject === currentSubject;
                return matchesSearch && matchesSubject;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-500 text-sm">No notes found.</div>`;
                return;
            }

            filtered.forEach(note => {
                const card = document.createElement('a');
                card.href = note.url;
                card.className = 'note-card';
                card.innerHTML = `
                    <div class="subject-tag">${note.subject}</div>
                    <h3>${note.chapter.replace(/\b\w/g, l => l.toUpperCase())}</h3>
                `;
                grid.appendChild(card);
            });
        }

        function filterBySubject(subject, btn) {
            currentSubject = subject;
            document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            renderNotes();
        }

        // Live Search Listener
        document.getElementById('search-bar').oninput = renderNotes;

        fetchNotes();
    </script>
</body>
</html>
