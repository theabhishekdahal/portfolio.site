<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Viewer · Abhishek Dahal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0a192f;
            --primary-color: #64ffda;
            --white-color: #edeef7;
            --dark-text: #a8b2d1;
            --light-navy: #112240;
            --slate: #8892b0;
        }
        body { background-color: #1e2a3a; font-family: 'Inter', sans-serif; margin: 0; }

        /* ── STICKY HEADER (Adobe Style) ── */
        #nav-container {
            position: fixed; top: 0; width: 100%; z-index: 100;
            transition: transform 0.4s ease-in-out;
            box-shadow: 0 10px 30px -10px rgba(2, 12, 27, 0.7);
        }
        .nav-hidden { transform: translateY(-100%); }
        #viewer-header { background-color: #0a192f; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.5rem; }
        #toolbar { display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.6rem 1.5rem; background-color: rgba(10, 25, 47, 0.98); backdrop-filter: blur(10px); }

        .tool-btn { background: var(--light-navy); border: 1px solid rgba(255,255,255,0.1); color: var(--dark-text); border-radius: 0.4rem; padding: 0.4rem 0.8rem; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .tool-btn:hover { border-color: var(--primary-color); color: var(--primary-color); }

        /* ── VIEWPORT ── */
        #pdf-viewport { max-width: 1000px; margin: 9rem auto 0; padding: 0 0 4rem; }
        
        /* This container allows the note's internal CSS to apply correctly */
        .viewer-page-wrapper { 
            margin: 0 auto 2.5rem; 
            position: relative;
            display: block;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }

        /* Input styling */
        #page-jump-input { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: white; width: 40px; text-align: center; border-radius: 4px; font-size: 12px; height: 24px; outline: none; }
        #page-jump-input:focus { border-color: var(--primary-color); }

        /* Hide Scrollbar */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>

    <!-- ── NAVIGATION ── -->
    <div id="nav-container">
        <div id="viewer-header">
            <a href="/notes/" class="text-slate-400 font-bold flex items-center gap-2 hover:text-cyan-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                Back
            </a>
            <span id="header-title" class="text-white font-bold truncate text-sm px-4">Loading Note...</span>
            <div class="flex items-center gap-2">
                <input type="number" id="page-jump-input" value="1">
                <span id="page-jump-total" class="text-slate-500 text-[10px]">/ 1</span>
            </div>
        </div>
        <div id="toolbar">
            <button class="tool-btn" id="prev-page-btn">Prev</button>
            <button class="tool-btn" id="next-page-btn">Next</button>
            <div class="w-px h-4 bg-gray-700 mx-2"></div>
            <button class="tool-btn" id="print-btn">Print / PDF</button>
        </div>
    </div>

    <!-- ── VIEWPORT ── -->
    <div id="pdf-viewport">
        <div id="loading-state" class="text-center py-20 text-slate-500 animate-pulse font-bold">LOADING...</div>
        <div id="pages-container"></div>
    </div>

    <script src="notes-data.js"></script>
    <script>
    // Global support for Note's internal Q&A toggle buttons
    window.tog = function(id, btn, label) {
        var el = document.getElementById(id);
        if (!el) return;
        var hidden = el.style.display === 'none' || el.style.display === '';
        el.style.display = hidden ? 'block' : 'none';
        btn.textContent = (hidden ? 'Hide ' : 'Show ') + label;
        btn.classList.toggle('tbtn-on', hidden);
    };

    (function () {
        const params = new URLSearchParams(window.location.search);
        const noteId = params.get('note') || '';
        const noteMeta = notesData.find(n => n.id === noteId);
        const storageKey = `note_progress_${noteId}`;

        if (!noteMeta) return;

        document.title = `${noteMeta.title} · Abhishek Dahal`;
        document.getElementById('header-title').textContent = noteMeta.title;

        // ── 1. SMART HEADER (Hide on scroll down, show on up) ──
        let lastScrollY = window.scrollY;
        const navContainer = document.getElementById('nav-container');

        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;
            if (currentScrollY > lastScrollY && currentScrollY > 150) navContainer.classList.add('nav-hidden');
            else navContainer.classList.remove('nav-hidden');
            lastScrollY = currentScrollY;
            updatePageCounter();
        }, { passive: true });

        // ── 2. FETCH & RENDER ──
        fetch(`/notes/${noteMeta.file}`)
            .then(res => res.text())
            .then(html => {
                document.getElementById('loading-state').style.display = 'none';
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // Fix CSS scoping (ensure note background/styles stay inside the page)
                const noteStyles = doc.querySelectorAll('style');
                noteStyles.forEach(style => {
                    let css = style.innerHTML;
                    css = css.replace(/body\s*{/g, '.viewer-page-wrapper {'); // Scope background
                    css = css.replace(/\.page\s*{/g, '.viewer-page-wrapper {'); // Use wrapper as page base
                    css = css.replace(/margin:\s*[^;]+;/g, 'margin: 0 auto;'); // Center pages
                    
                    const scopedStyle = document.createElement('style');
                    scopedStyle.innerHTML = css;
                    document.head.appendChild(scopedStyle);
                });

                const container = document.getElementById('pages-container');
                const manualPages = doc.querySelectorAll('.page');
                
                if (manualPages.length > 0) {
                    manualPages.forEach((p, idx) => {
                        const wrapper = document.createElement('div');
                        // Apply both viewer class and the note's original class for 1:1 rendering
                        wrapper.className = 'viewer-page-wrapper page'; 
                        wrapper.dataset.page = idx + 1;
                        wrapper.innerHTML = p.innerHTML;
                        container.appendChild(wrapper);
                    });
                } else {
                    // Fallback for notes without .page divs
                    const wrapper = document.createElement('div');
                    wrapper.className = 'viewer-page-wrapper';
                    wrapper.innerHTML = html;
                    container.appendChild(wrapper);
                }

                const total = document.querySelectorAll('.viewer-page-wrapper').length;
                document.getElementById('page-jump-total').textContent = `/ ${total}`;
                
                // Progress Memory: Restore last page
                const lastPage = localStorage.getItem(storageKey);
                if (lastPage) setTimeout(() => scrollToPage(parseInt(lastPage), 'auto'), 200);
            });

        // ── 3. PAGINATION HELPERS ──
        function updatePageCounter() {
            const pages = document.querySelectorAll('.viewer-page-wrapper');
            let current = 1;
            pages.forEach(p => {
                if (p.getBoundingClientRect().top < 200) current = p.dataset.page;
            });
            document.getElementById('page-jump-input').value = current;
            localStorage.setItem(storageKey, current);
        }

        function scrollToPage(num, behavior = 'smooth') {
            const el = document.querySelector(`.viewer-page-wrapper[data-page="${num}"]`);
            if (el) {
                // Adjust for the height of the sticky header
                const offset = 140; 
                const y = el.getBoundingClientRect().top + window.pageYOffset - offset;
                window.scrollTo({ top: y, behavior: behavior });
            }
        }

        // ── 4. EVENT LISTENERS ──
        document.getElementById('prev-page-btn').addEventListener('click', () => {
            const curr = parseInt(document.getElementById('page-jump-input').value);
            scrollToPage(Math.max(1, curr - 1));
        });

        document.getElementById('next-page-btn').addEventListener('click', () => {
            const curr = parseInt(document.getElementById('page-jump-input').value);
            const total = document.querySelectorAll('.viewer-page-wrapper').length;
            scrollToPage(Math.min(total, curr + 1));
        });

        document.getElementById('page-jump-input').addEventListener('change', (e) => {
            scrollToPage(e.target.value);
        });

        document.getElementById('print-btn').addEventListener('click', () => window.print());

    }());
    </script>
</body>
</html>
