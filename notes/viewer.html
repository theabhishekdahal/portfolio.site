<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Viewer · Abhishek Dahal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Lora:ital,wght@0,400;0,600;1,400&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0a192f;
            --primary-color: #64ffda;
            --white-color: #edeef7;
            --dark-text: #a8b2d1;
            --light-navy: #112240;
            --slate: #8892b0;
        }
        body { background-color: #1e2a3a; font-family: 'Inter', sans-serif; margin: 0; }

        /* ── SMART HEADER ── */
        #sticky-nav-wrapper {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            transition: transform 0.3s ease-in-out;
            box-shadow: 0 10px 30px -10px rgba(2, 12, 27, 0.7);
        }
        .nav-hidden { transform: translateY(-100%); }

        #viewer-header { background-color: #0a192f; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.5rem; gap: 1rem; }
        #toolbar { display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.6rem 1.5rem; background-color: rgba(10, 25, 47, 0.98); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.04); }
        
        .tool-btn { background: var(--light-navy); border: 1px solid rgba(255,255,255,0.08); color: var(--dark-text); border-radius: 0.4rem; padding: 0.35rem 0.75rem; font-size: 0.75rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.3rem; transition: all 0.2s; }
        .tool-btn:hover { border-color: var(--primary-color); color: var(--primary-color); background: rgba(100, 255, 218, 0.05); }
        .tool-btn.active { color: #facc15; border-color: #facc15; }

        /* Page Content */
        #pdf-viewport { max-width: 900px; margin: 8rem auto 0; padding: 0 1rem 4rem; }
        .note-page { background: #fff; width: 100%; max-width: 794px; margin: 0 auto 2.5rem; border-radius: 3px; box-shadow: 0 4px 24px rgba(0,0,0,0.45); padding: 72px 80px; position: relative; font-family: 'Lora', serif; color: #1a1a2e; }
        
        /* EDITOR OVERLAY */
        #editor-container { display: none; position: fixed; inset: 0; background: #0a192f; z-index: 200; flex-direction: column; padding: 1rem; }
        #editor-textarea { flex: 1; background: #112240; color: #e2e8f0; font-family: 'Fira Code', monospace; padding: 1.5rem; border-radius: 8px; border: 1px solid rgba(100,255,218,0.2); outline: none; resize: none; font-size: 0.95rem; line-height: 1.6; }
        
        #page-jump-input { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--white-color); width: 45px; text-align: center; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="sticky-nav-wrapper">
        <div id="viewer-header">
            <a id="back-btn" href="/notes/" class="text-slate-400 font-bold flex items-center gap-2 hover:text-cyan-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                Back
            </a>
            <span id="header-title" class="text-white font-bold truncate px-4">Loading…</span>
            <div class="flex items-center gap-2 text-xs">
                <input type="number" id="page-jump-input" min="1" value="1">
                <span id="page-jump-total" class="text-slate-500">/ —</span>
            </div>
        </div>

        <div id="toolbar">
            <button class="tool-btn" id="prev-page-btn">Prev</button>
            <button class="tool-btn" id="next-page-btn">Next</button>
            <div class="w-px h-4 bg-gray-700 mx-1"></div>
            <button class="tool-btn" id="edit-note-btn">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" stroke-width="2" /></svg>
                Edit Note
            </button>
            <button class="tool-btn" id="print-btn">Print</button>
        </div>
    </div>

    <!-- ── EDITOR MODAL ── -->
    <div id="editor-container">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-cyan-400 font-bold">Edit Mode (HTML)</h2>
            <div class="flex gap-2">
                <button id="close-editor" class="tool-btn">Cancel</button>
                <button id="save-note-btn" class="tool-btn active">Save to GitHub</button>
            </div>
        </div>
        <textarea id="editor-textarea" spellcheck="false"></textarea>
    </div>

    <div id="pdf-viewport">
        <div id="loading-state" class="text-center py-20 text-slate-400">Loading note…</div>
        <div id="pages-container"></div>
    </div>

    <script src="notes-data.js"></script>
    <script>
    (function () {
        const params = new URLSearchParams(window.location.search);
        const noteId = params.get('note') || '';
        const noteMeta = notesData.find(n => n.id === noteId);
        
        // GH Config (Update these to match your repo)
        const REPO_OWNER = "theabhishekdahal"; 
        const REPO_NAME = "portfolio.site"; // Make sure this matches your exact repo name

        const navWrapper = document.getElementById('sticky-nav-wrapper');
        const editorContainer = document.getElementById('editor-container');
        const editorTextarea = document.getElementById('editor-textarea');
        const storageKey = `note_progress_${noteId}`;

        if (!noteMeta) return;

        document.title = `${noteMeta.title} · Abhishek Dahal`;
        document.getElementById('header-title').textContent = noteMeta.title;

        // ── 1. SMART HEADER LOGIC ──
        let lastScrollY = window.scrollY;
        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;
            const delta = 10; // min distance to trigger

            if (Math.abs(lastScrollY - currentScrollY) <= delta) return;

            if (currentScrollY > lastScrollY && currentScrollY > 100) {
                navWrapper.classList.add('nav-hidden'); // Scrolling Down
            } else {
                navWrapper.classList.remove('nav-hidden'); // Scrolling Up
            }
            lastScrollY = currentScrollY;
        }, { passive: true });

        // ── 2. RENDER & PROGRESS LOGIC ──
        fetch(`/notes/${noteMeta.file}`)
            .then(res => res.text())
            .then(html => {
                document.getElementById('loading-state').style.display = 'none';
                renderNote(html);
                
                const lastPage = localStorage.getItem(storageKey);
                if (lastPage) setTimeout(() => scrollToPage(parseInt(lastPage), 'auto'), 100);
            });

        function renderNote(html) {
            const container = document.getElementById('pages-container');
            container.innerHTML = '';
            
            // Basic Auto-Pagination (Simpler for rendering)
            const pages = html.split('<!-- page-break -->'); 
            const totalPages = pages.length;
            document.getElementById('page-jump-total').textContent = `/ ${totalPages}`;

            pages.forEach((content, idx) => {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'note-page';
                pageDiv.dataset.page = idx + 1;
                pageDiv.innerHTML = content + `<div class="page-num-footer">— ${idx + 1} / ${totalPages} —</div>`;
                container.appendChild(pageDiv);
            });
        }

        // ── 3. EDITOR & GITHUB API LOGIC ──
        document.getElementById('edit-note-btn').addEventListener('click', () => {
            fetch(`/notes/${noteMeta.file}`)
                .then(res => res.text())
                .then(content => {
                    editorTextarea.value = content;
                    editorContainer.style.display = 'flex';
                });
        });

        document.getElementById('close-editor').addEventListener('click', () => editorContainer.style.display = 'none');

        document.getElementById('save-note-btn').addEventListener('click', async () => {
            const token = prompt("Enter GitHub Personal Access Token to Save:");
            if (!token) return;

            const saveBtn = document.getElementById('save-note-btn');
            saveBtn.textContent = "Saving...";
            
            const path = `notes/${noteMeta.file}`;
            const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`;

            try {
                // 1. Get the current file SHA (required for update)
                const getRes = await fetch(apiUrl, {
                    headers: { "Authorization": `token ${token}` }
                });
                const fileData = await getRes.json();
                
                // 2. Commit the new content
                const newContent = btoa(unescape(encodeURIComponent(editorTextarea.value))); // Handle UTF-8
                
                const putRes = await fetch(apiUrl, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: `Edit note: ${noteMeta.title} (from frontend)`,
                        content: newContent,
                        sha: fileData.sha
                    })
                });

                if (putRes.ok) {
                    alert("Saved Successfully! Changes will appear on site in 1-2 minutes.");
                    location.reload();
                } else {
                    const err = await putRes.json();
                    alert("Error: " + err.message);
                }
            } catch (e) {
                alert("Critical Error: " + e.message);
            } finally {
                saveBtn.textContent = "Save to GitHub";
            }
        });

        // ── HELPERS ──
        function scrollToPage(num, behavior = 'smooth') {
            const el = document.querySelector(`.note-page[data-page="${num}"]`);
            if (el) {
                const y = el.getBoundingClientRect().top + window.pageYOffset - 140;
                window.scrollTo({ top: y, behavior: behavior });
            }
        }

        document.getElementById('prev-page-btn').addEventListener('click', () => {
            const curr = parseInt(document.getElementById('page-jump-input').value);
            scrollToPage(Math.max(1, curr - 1));
        });

        document.getElementById('next-page-btn').addEventListener('click', () => {
            const curr = parseInt(document.getElementById('page-jump-input').value);
            scrollToPage(curr + 1);
        });

        document.getElementById('page-jump-input').addEventListener('change', (e) => scrollToPage(e.target.value));
        document.getElementById('print-btn').addEventListener('click', () => window.print());

    }());
    </script>
</body>
</html>
