<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Viewer · Abhishek Dahal</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        /* ── Shell chrome ─────────────────────────────────────────────── */
        :root {
            --bg-color: #0a192f;
            --primary-color: #64ffda;
            --white-color: #edeef7;
            --dark-text: #a8b2d1;
            --light-navy: #112240;
            --slate: #8892b0;
        }
        body {
            background-color: #1e2a3a;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }
        /* Sticky wrapper that freezes both header + toolbar while scrolling */
        #sticky-bar {
            position: sticky;
            top: 0;
            z-index: 50;
        }
        #viewer-header {
            background-color: #0a192f;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.5rem;
            gap: 1rem;
        }
        #back-btn {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--dark-text);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
            white-space: nowrap;
        }
        #back-btn:hover { color: var(--primary-color); }
        #header-title {
            color: var(--white-color);
            font-size: 0.9rem;
            font-weight: 700;
            flex: 1;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #page-counter {
            color: var(--slate);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            white-space: nowrap;
            background: var(--light-navy);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            min-width: 90px;
            text-align: center;
        }
        /* ── Toolbar ───────────────────────────────────────────────────── */
        #toolbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.6rem 1.5rem;
            background-color: rgba(10,25,47,0.6);
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .tool-btn {
            background: var(--light-navy);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--dark-text);
            border-radius: 0.4rem;
            padding: 0.35rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: border-color 0.2s, color 0.2s;
        }
        .tool-btn:hover { border-color: var(--primary-color); color: var(--primary-color); }
        /* ── PDF viewport ──────────────────────────────────────────────── */
        #pdf-viewport {
            max-width: 900px;
            margin: 2rem auto 0;
            padding: 0 1rem 4rem;
        }
        /* Each "page" block */
        .note-page {
            background: #fff;
            width: 100%;
            /* A4 aspect: max-width 794px with padding ~ 2.54cm = ~96px each side */
            max-width: 794px;
            margin: 0 auto 2.5rem;
            border-radius: 3px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.45), 0 1px 3px rgba(0,0,0,0.3);
            padding: 72px 80px;
            position: relative;
            min-height: 200px;
            /* Typography inside pages */
            font-family: 'Lora', Georgia, serif;
            font-size: 1rem;
            line-height: 1.8;
            color: #1a1a2e;
        }
        /* Page number footer inside each page */
        .page-num-footer {
            position: absolute;
            bottom: 22px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-size: 0.72rem;
            color: #9ca3af;
            letter-spacing: 0.06em;
            user-select: none;
        }
        /* ── Note content typography ───────────────────────────────────── */
        .note-page h1 { font-size: 1.7rem; font-weight: 700; margin: 0 0 1rem; line-height: 1.25; color: #0f172a; }
        .note-page h2 { font-size: 1.25rem; font-weight: 700; margin: 1.6rem 0 0.6rem; color: #1e3a5f; border-bottom: 1.5px solid #e2e8f0; padding-bottom: 0.3rem; }
        .note-page h3 { font-size: 1.05rem; font-weight: 700; margin: 1.2rem 0 0.4rem; color: #334155; }
        .note-page p { margin: 0 0 0.9rem; }
        .note-page ul, .note-page ol { padding-left: 1.6rem; margin: 0 0 0.9rem; }
        .note-page li { margin-bottom: 0.3rem; }
        .note-page blockquote { border-left: 4px solid #64ffda; margin: 1rem 0; padding: 0.6rem 1rem; background: #f0fdfa; color: #1e3a5f; border-radius: 0 4px 4px 0; font-style: italic; }
        .note-page table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.9rem; }
        .note-page th { background: #1e3a5f; color: #fff; padding: 0.5rem 0.75rem; text-align: left; font-weight: 600; }
        .note-page td { padding: 0.45rem 0.75rem; border-bottom: 1px solid #e2e8f0; }
        .note-page tr:nth-child(even) td { background: #f8fafc; }
        .note-page code { background: #f1f5f9; padding: 0.1rem 0.35rem; border-radius: 3px; font-size: 0.85em; font-family: 'Courier New', monospace; color: #0f4c75; }
        .note-page pre { background: #1e293b; color: #e2e8f0; padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; line-height: 1.6; margin: 1rem 0; }
        .note-page pre code { background: none; color: inherit; padding: 0; }
        .note-page hr { border: none; border-top: 1.5px solid #e2e8f0; margin: 1.5rem 0; }
        .note-page strong { color: #0f172a; }
        .note-page a { color: #0284c7; text-decoration: underline; }
        .note-page .note-meta { font-family: 'Inter', sans-serif; font-size: 0.78rem; color: #64748b; margin-bottom: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; }
        .note-page .note-meta span { display: inline-flex; align-items: center; gap: 0.3rem; }
        /* ── Loading / error states ──────────────────────────────────── */
        #loading-state, #error-state {
            text-align: center;
            padding: 5rem 1rem;
            color: var(--slate);
        }
        /* ── Comments section ─────────────────────────────────────────── */
        #comments-section {
            max-width: 794px;
            margin: 0 auto 4rem;
            padding: 0 1rem;
        }
        #comments-section h2 {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--white-color);
            margin-bottom: 1.25rem;
        }
        .utterances { max-width: 100% !important; }
        /* ── Highlight mode ───────────────────────────────────────────── */
        #highlight-notice {
            display: none;
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: #1e3a5f;
            border: 1px solid var(--primary-color);
            color: var(--white-color);
            padding: 0.6rem 1.25rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-family: 'Inter', sans-serif;
            z-index: 100;
            white-space: nowrap;
        }
        /* Floating highlight/comment tooltip on text selection */
        #selection-tooltip {
            display: none;
            position: fixed;
            z-index: 200;
            background: #0a192f;
            border: 1px solid rgba(100,255,218,0.4);
            border-radius: 0.5rem;
            padding: 0.3rem 0.4rem;
            gap: 0.3rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            transform: translateX(-50%) translateY(-100%);
            margin-top: -6px;
            font-family: 'Inter', sans-serif;
            flex-direction: row;
            align-items: center;
        }
        #selection-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: rgba(100,255,218,0.4);
        }
        .sel-btn {
            background: transparent;
            border: none;
            color: var(--dark-text);
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            white-space: nowrap;
            transition: background 0.15s, color 0.15s;
        }
        .sel-btn:hover { background: var(--light-navy); color: var(--primary-color); }
        /* Persistent text highlights */
        .text-highlight {
            background-color: #fef08a;
            color: #1a1a2e !important;
            border-radius: 2px;
            cursor: pointer;
        }
        .text-highlight:hover::after {
            content: '✕';
            margin-left: 3px;
            font-size: 0.7em;
            opacity: 0.6;
        }
        /* Per-page comment button */
        .page-comment-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            padding-top: 0.75rem;
            border-top: 1px solid #e2e8f0;
        }
        .page-inline-comment-btn {
            font-family: 'Inter', sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            color: #64748b;
            background: transparent;
            border: 1px solid #e2e8f0;
            border-radius: 9999px;
            padding: 0.25rem 0.7rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            transition: border-color 0.2s, color 0.2s;
            user-select: none;
        }
        .page-inline-comment-btn:hover { border-color: #64ffda; color: #1e3a5f; }
        /* Resume-page toast */
        #resume-toast {
            display: none;
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: #112240;
            border: 1px solid rgba(100,255,218,0.5);
            color: var(--white-color);
            padding: 0.7rem 1.1rem;
            border-radius: 0.6rem;
            font-size: 0.78rem;
            font-family: 'Inter', sans-serif;
            z-index: 150;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            max-width: 260px;
            flex-direction: column;
            gap: 0.5rem;
        }
        #resume-toast strong { color: var(--primary-color); }
        .resume-actions { display: flex; gap: 0.5rem; }
        .resume-btn {
            flex: 1;
            padding: 0.3rem 0.6rem;
            border-radius: 0.3rem;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
        }
        #resume-yes { background: var(--primary-color); color: #0a192f; border-color: var(--primary-color); }
        #resume-no  { background: transparent; color: var(--dark-text); border-color: rgba(255,255,255,0.15); }
        /* ── Print styles ─────────────────────────────────────────────── */
        @media print {
            body { background: #fff !important; }
            #sticky-bar, #comments-section, #highlight-notice, #selection-tooltip, #resume-toast { display: none !important; }
            .page-comment-row { display: none !important; }
            #pdf-viewport { max-width: 100%; margin: 0; padding: 0; }
            .note-page {
                box-shadow: none;
                margin: 0;
                border-radius: 0;
                padding: 40px 60px;
                page-break-after: always;
                max-width: 100%;
            }
            .note-page:last-child { page-break-after: avoid; }
        }
        @media (max-width: 600px) {
            .note-page { padding: 32px 20px 48px; }
        }
    </style>
</head>
<body>

    <!-- ── Sticky bar (header + toolbar pinned while scrolling) ──────── -->
    <div id="sticky-bar">

    <!-- ── Header ─────────────────────────────────────────────────────── -->
    <div id="viewer-header">
        <a id="back-btn" href="/notes/">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            All Notes
        </a>
        <span id="header-title">Loading…</span>
        <span id="page-counter">Page — / —</span>
    </div>

    <!-- ── Toolbar ────────────────────────────────────────────────────── -->
    <div id="toolbar">
        <button class="tool-btn" id="prev-page-btn" title="Previous page">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            Prev
        </button>
        <button class="tool-btn" id="next-page-btn" title="Next page">
            Next
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="tool-btn" id="print-btn" title="Print / Save as PDF">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
            Print / PDF
        </button>
        <button class="tool-btn" id="scroll-comments-btn" title="Jump to comments">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/></svg>
            Comments
        </button>
    </div>

    </div><!-- /#sticky-bar -->

    <!-- ── PDF Viewport ───────────────────────────────────────────────── -->
    <div id="pdf-viewport">
        <div id="loading-state">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mx-auto mb-3 opacity-40 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            <p class="text-sm">Loading note…</p>
        </div>
        <div id="error-state" style="display:none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mx-auto mb-3 opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
            <p class="text-sm font-semibold">Note not found.</p>
            <p class="text-xs mt-1 opacity-60">Check the URL or <a href="/notes/" class="underline">browse all notes</a>.</p>
        </div>
        <div id="pages-container"></div>
    </div>

    <!-- ── Comments ──────────────────────────────────────────────────── -->
    <div id="comments-section" style="display:none">
        <h2>Comments</h2>
        <script
            src="https://utteranc.es/client.js"
            repo="theabhishekdahal/portfolio.site"
            issue-term="pathname"
            label="note-comment"
            theme="github-dark"
            crossorigin="anonymous"
            async>
        </script>
    </div>

    <div id="highlight-notice">Text highlighted! Right-click to copy.</div>

    <!-- ── Floating tooltip for text selection ──────────────────────── -->
    <div id="selection-tooltip">
        <button class="sel-btn" id="sel-highlight-btn" title="Highlight selected text">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
            Highlight
        </button>
        <button class="sel-btn" id="sel-comment-btn" title="Comment on this page">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/></svg>
            Comment
        </button>
    </div>

    <!-- ── Resume-page toast ─────────────────────────────────────────── -->
    <div id="resume-toast">
        <span>Resume at <strong id="resume-page-label">page 1</strong>?</span>
        <div class="resume-actions">
            <button class="resume-btn" id="resume-yes">Resume</button>
            <button class="resume-btn" id="resume-no">Stay at top</button>
        </div>
    </div>

    <script src="notes-data.js"></script>
    <script>
    (function () {

        // ── Helpers ──────────────────────────────────────────────────────
        const params   = new URLSearchParams(window.location.search);
        const noteId   = params.get('note') || '';
        const noteMeta = notesData.find(n => n.id === noteId);

        const pagesContainer   = document.getElementById('pages-container');
        const loadingState     = document.getElementById('loading-state');
        const errorState       = document.getElementById('error-state');
        const pageCounter      = document.getElementById('page-counter');
        const headerTitle      = document.getElementById('header-title');
        const commentsSection  = document.getElementById('comments-section');

        // ── Validate note exists ──────────────────────────────────────────
        if (!noteMeta) {
            loadingState.style.display = 'none';
            errorState.style.display = 'block';
            return;
        }

        document.title = `${noteMeta.title} · Abhishek Dahal`;
        headerTitle.textContent = noteMeta.title;

        // ── Constants ─────────────────────────────────────────────────────
        const PAGE_SAVE_DEBOUNCE_MS  = 600;  // ms to debounce page-position saves
        const SELECTION_DELAY_MS     = 10;   // ms to wait for selection to finalise
        const TOAST_AUTO_DISMISS_MS  = 8000; // ms before resume toast auto-hides


        const PAGE_KEY       = `lastPage_${noteId}`;
        const HIGHLIGHTS_KEY = `highlights_${noteId}`;

        // ── Fetch the note HTML ───────────────────────────────────────────
        fetch(`/notes/${noteMeta.file}`)
            .then(res => {
                if (!res.ok) throw new Error('fetch failed');
                return res.text();
            })
            .then(html => {
                loadingState.style.display = 'none';
                renderNote(html);
                commentsSection.style.display = 'block';
            })
            .catch(() => {
                loadingState.style.display = 'none';
                errorState.style.display = 'block';
            });

        // ── Render note into pages ────────────────────────────────────────
        function renderNote(html) {
            // Parse into a document fragment
            const parser = new DOMParser();
            const doc    = parser.parseFromString(html, 'text/html');
            const body   = doc.body;

            // Strip any <script> tags from the note for safety
            body.querySelectorAll('script').forEach(s => s.remove());

            /**
             * Detect page splits.
             * The note may have explicit <div class="page"> wrappers.
             * If not, we treat the whole body as one page and auto-paginate
             * by splitting child elements into chunks of ~1050px (A4 ≈ 1122px
             * minus vertical padding).
             */
            const manualPages = body.querySelectorAll('.page, [data-page]');
            let pageContents = [];

            if (manualPages.length > 0) {
                manualPages.forEach(p => pageContents.push(p.innerHTML));
            } else {
                // Auto-paginate: group top-level children by estimated height
                const PAGE_HEIGHT = 1050; // px budget per page
                let currentGroup = document.createElement('div');
                let estimatedHeight = 0;

                Array.from(body.children).forEach(child => {
                    const tag = child.tagName;
                    // Rough height estimates per element type
                    const h = tag === 'TABLE' ? (child.querySelectorAll('tr').length * 38 + 50)
                             : tag === 'PRE'   ? (child.textContent.split('\n').length * 20 + 20)
                             : tag === 'H1'    ? 80
                             : tag === 'H2'    ? 56
                             : tag === 'H3'    ? 44
                             : tag === 'HR'    ? 30
                             : tag === 'BLOCKQUOTE' ? 80
                             : 40; // p, li, div …

                    if (estimatedHeight + h > PAGE_HEIGHT && currentGroup.innerHTML.trim()) {
                        pageContents.push(currentGroup.innerHTML);
                        currentGroup = document.createElement('div');
                        estimatedHeight = 0;
                    }
                    currentGroup.appendChild(child.cloneNode(true));
                    estimatedHeight += h;
                });
                if (currentGroup.innerHTML.trim()) {
                    pageContents.push(currentGroup.innerHTML);
                }
            }

            if (pageContents.length === 0) pageContents = ['<p><em>This note appears to be empty.</em></p>'];

            const totalPages = pageContents.length;
            pageContents.forEach((content, idx) => {
                const pageNum = idx + 1;
                const pageDiv = document.createElement('div');
                pageDiv.className = 'note-page';
                pageDiv.dataset.page = pageNum;
                pageDiv.innerHTML = content +
                    `<div class="page-num-footer">— ${pageNum} / ${totalPages} —</div>` +
                    `<div class="page-comment-row">
                        <button class="page-inline-comment-btn" data-page="${pageNum}" title="Leave a comment about this page">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/></svg>
                            Comment on page ${pageNum}
                        </button>
                    </div>`;
                pagesContainer.appendChild(pageDiv);
            });

            // Wire per-page comment buttons
            pagesContainer.querySelectorAll('.page-inline-comment-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    commentsSection.scrollIntoView({ behavior: 'smooth' });
                });
            });

            updatePageCounter();
            setupScrollSpy();
            setupPageNavigation(totalPages);
            restoreHighlights();
            offerPageResume();
        }

        // ── Page counter (scroll-spy) ─────────────────────────────────────
        function getCurrentPage() {
            const pages = document.querySelectorAll('.note-page');
            let current = 1;
            pages.forEach(p => {
                const rect = p.getBoundingClientRect();
                if (rect.top <= window.innerHeight * 0.5) current = parseInt(p.dataset.page, 10);
            });
            return current;
        }

        function updatePageCounter() {
            const pages = document.querySelectorAll('.note-page');
            if (!pages.length) { pageCounter.textContent = 'Page — / —'; return; }
            pageCounter.textContent = `Page ${getCurrentPage()} / ${pages.length}`;
        }

        function setupScrollSpy() {
            let saveTimer;
            window.addEventListener('scroll', () => {
                updatePageCounter();
                // Auto-save current page (debounced)
                clearTimeout(saveTimer);
                saveTimer = setTimeout(() => {
                    const pg = getCurrentPage();
                    if (pg > 1) {
                        localStorage.setItem(PAGE_KEY, pg);
                    } else {
                        localStorage.removeItem(PAGE_KEY);
                    }
                }, PAGE_SAVE_DEBOUNCE_MS);
            }, { passive: true });
        }

        // ── Page navigation buttons ──────────────────────────────────────
        function setupPageNavigation(totalPages) {
            document.getElementById('prev-page-btn').addEventListener('click', () => {
                const target = Math.max(1, getCurrentPage() - 1);
                scrollToPage(target);
            });

            document.getElementById('next-page-btn').addEventListener('click', () => {
                const target = Math.min(totalPages, getCurrentPage() + 1);
                scrollToPage(target);
            });
        }

        function scrollToPage(num) {
            const el = document.querySelector(`.note-page[data-page="${num}"]`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ── Auto-resume last page ─────────────────────────────────────────
        function offerPageResume() {
            const saved = parseInt(localStorage.getItem(PAGE_KEY), 10);
            if (!saved || saved <= 1) return;
            const toast       = document.getElementById('resume-toast');
            const label       = document.getElementById('resume-page-label');
            label.textContent = `page ${saved}`;
            toast.style.display = 'flex';
            document.getElementById('resume-yes').addEventListener('click', () => {
                toast.style.display = 'none';
                scrollToPage(saved);
            }, { once: true });
            document.getElementById('resume-no').addEventListener('click', () => {
                toast.style.display = 'none';
                localStorage.removeItem(PAGE_KEY);
            }, { once: true });
            // Auto-dismiss
            setTimeout(() => { toast.style.display = 'none'; }, TOAST_AUTO_DISMISS_MS);
        }

        // ── Text highlight functionality ──────────────────────────────────
        let highlights = [];
        try { highlights = JSON.parse(localStorage.getItem(HIGHLIGHTS_KEY) || '[]'); } catch (e) { highlights = []; }

        const selTooltip = document.getElementById('selection-tooltip');
        let selPage = null;
        let selText  = '';

        document.addEventListener('mouseup', (e) => {
            // Small delay so the browser finalises the selection
            setTimeout(() => {
                const selection = window.getSelection();
                if (!selection || selection.isCollapsed) { hideTooltip(); return; }
                const text = selection.toString().trim();
                if (!text) { hideTooltip(); return; }

                const pageEl = selection.anchorNode && selection.anchorNode.parentElement &&
                               selection.anchorNode.parentElement.closest('.note-page');
                if (!pageEl) { hideTooltip(); return; }

                const range = selection.getRangeAt(0);
                const rect  = range.getBoundingClientRect();
                selPage = parseInt(pageEl.dataset.page, 10);
                selText = text;

                selTooltip.style.display = 'flex';
                selTooltip.style.top  = `${rect.top}px`;
                selTooltip.style.left = `${rect.left + rect.width / 2}px`;
            }, SELECTION_DELAY_MS);
        });

        document.addEventListener('mousedown', (e) => {
            if (!selTooltip.contains(e.target)) hideTooltip();
        });

        function hideTooltip() {
            selTooltip.style.display = 'none';
            selPage = null;
            selText = '';
        }

        document.getElementById('sel-highlight-btn').addEventListener('click', () => {
            if (selPage === null || !selText) return;
            const pageEl = document.querySelector(`.note-page[data-page="${selPage}"]`);
            if (pageEl) {
                applyHighlightToPage(pageEl, selText);
                saveHighlight(selPage, selText);
            }
            window.getSelection().removeAllRanges();
            hideTooltip();
        });

        document.getElementById('sel-comment-btn').addEventListener('click', () => {
            hideTooltip();
            window.getSelection().removeAllRanges();
            commentsSection.scrollIntoView({ behavior: 'smooth' });
        });

        function saveHighlight(page, text) {
            const already = highlights.some(h => h.page === page && h.text === text);
            if (!already) {
                highlights.push({ page, text });
                try { localStorage.setItem(HIGHLIGHTS_KEY, JSON.stringify(highlights)); } catch (e) {}
            }
        }

        function restoreHighlights() {
            highlights.forEach(({ page, text }) => {
                const pageEl = document.querySelector(`.note-page[data-page="${page}"]`);
                if (pageEl) applyHighlightToPage(pageEl, text);
            });
        }

        /**
         * Walk text nodes inside container, find the first occurrence of text,
         * and wrap it in a <span class="text-highlight">.
         */
        function applyHighlightToPage(container, text) {
            const walker = document.createTreeWalker(
                container,
                NodeFilter.SHOW_TEXT,
                {
                    acceptNode(node) {
                        // Skip page-footer and comment-row text
                        if (node.parentElement && node.parentElement.closest('.page-num-footer, .page-comment-row')) {
                            return NodeFilter.FILTER_REJECT;
                        }
                        return NodeFilter.FILTER_ACCEPT;
                    }
                }
            );

            const nodes = [];
            let node;
            while ((node = walker.nextNode())) nodes.push(node);

            for (const textNode of nodes) {
                const idx = textNode.textContent.indexOf(text);
                if (idx === -1) continue;
                const before = textNode.textContent.slice(0, idx);
                const after  = textNode.textContent.slice(idx + text.length);
                const mark   = document.createElement('span');
                mark.className = 'text-highlight';
                mark.textContent = text;
                mark.title = 'Click to remove highlight';
                mark.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeHighlight(mark, parseInt(container.dataset.page, 10), text);
                });
                const frag = document.createDocumentFragment();
                if (before) frag.appendChild(document.createTextNode(before));
                frag.appendChild(mark);
                if (after)  frag.appendChild(document.createTextNode(after));
                textNode.parentNode.replaceChild(frag, textNode);
                break; // wrap first occurrence only
            }
        }

        function removeHighlight(markEl, page, text) {
            const parent = markEl.parentNode;
            parent.replaceChild(document.createTextNode(text), markEl);
            parent.normalize();
            highlights = highlights.filter(h => !(h.page === page && h.text === text));
            try { localStorage.setItem(HIGHLIGHTS_KEY, JSON.stringify(highlights)); } catch (e) {}
        }

        // ── Toolbar buttons ──────────────────────────────────────────────
        document.getElementById('print-btn').addEventListener('click', () => window.print());
        document.getElementById('scroll-comments-btn').addEventListener('click', () => {
            commentsSection.scrollIntoView({ behavior: 'smooth' });
        });

    }());
    </script>
</body>
</html>
